version: "2026.1"
# Catálogo de obligaciones. Es data, no código: se versiona por ejercicio.
# auto: true  -> se genera automáticamente en el calendario del contribuyente.
# auto: false -> aparece en el catálogo y puede añadirse a mano (trámites puntuales).
models:
  - code: "036"
    name: "Alta, modificación y baja censal"
    entity: AEAT
    category: "Censal"
    periodicity: "Puntual"
    description: "Comunicación de alta, cambios o baja en el Censo de Empresarios, Profesionales y Retenedores."
    url: "https://sede.agenciatributaria.gob.es/Sede/todas-gestiones.html"
    auto: false
    documents:
      - "DNI/NIE del titular o escritura de constitución"
      - "Escritura de apoderamiento, si aplica"
      - "Modelo 036/037 firmado"
    notes: "Se presenta antes de iniciar la actividad o en el plazo de un mes desde el cambio."

  - code: "037"
    name: "Declaración censal simplificada"
    entity: AEAT
    category: "Censal"
    periodicity: "Puntual"
    description: "Versión simplificada del modelo 036 para autónomos con actividades y regímenes sencillos."
    url: "https://sede.agenciatributaria.gob.es/Sede/todas-gestiones.html"
    auto: false
    applies:
      legal_forms: ["autonomo"]
    documents:
      - "DNI/NIE"
      - "Certificado de empadronamiento, si aplica"
    notes: "No admite todos los supuestos del 036. Verifica la vigencia del modelo antes de presentarlo."

  - code: "303"
    name: "Autoliquidación de IVA"
    entity: AEAT
    category: "IVA"
    periodicity: "Trimestral"
    description: "Liquidación del IVA devengado y deducible del periodo."
    url: "https://sede.agenciatributaria.gob.es/Sede/iva/presentar-declaracion-iva-modelo-303.html"
    auto: true
    applies:
      economic_activity: true
    schedule:
      type: quarterly
      due_months: [1, 4, 7, 10]
      due_day: 20
    documents:
      - "Facturas emitidas del periodo"
      - "Facturas recibidas y gastos deducibles"
      - "Justificantes de importación y exportación"
      - "Liquidaciones de IVA de otros Estados miembros"
    notes: "Mensual para grandes empresas, grupos de IVA, REDEME y SII. Plazo: 1-20 del mes siguiente."

  - code: "390"
    name: "Resumen anual de IVA"
    entity: AEAT
    category: "IVA"
    periodicity: "Anual"
    description: "Resumen anual de las operaciones de IVA declaradas en los modelos 303 del ejercicio."
    url: "https://sede.agenciatributaria.gob.es/Sede/iva.html"
    auto: true
    applies:
      economic_activity: true
    schedule:
      type: annual
      due_months: [1]
      due_day: 31
      period_year_offset: -1
    documents:
      - "Resúmenes trimestrales de IVA"
      - "Libro registro de facturas emitidas y recibidas"
    notes: "Plazo: 1-31 de enero. Algunos sujetos están exonerados; revisa el supuesto."

  - code: "130"
    name: "Pago fraccionado de IRPF (estimación directa)"
    entity: AEAT
    category: "IRPF"
    periodicity: "Trimestral"
    description: "Pago a cuenta del IRPF para autónomos en estimación directa."
    url: "https://sede.agenciatributaria.gob.es/Sede/irpf.html"
    auto: true
    applies:
      legal_forms: ["autonomo"]
      irpf_methods: ["directa"]
      economic_activity: true
    schedule:
      type: quarterly
      due_months: [1, 4, 7, 10]
      due_day: 20
    documents:
      - "Facturas emitidas del periodo"
      - "Facturas recibidas y gastos deducibles"
      - "Nóminas y seguros sociales"
      - "Retenciones soportadas o practicadas"
    notes: "20% del rendimiento neto acumulado, menos retenciones y pagos previos."

  - code: "131"
    name: "Pago fraccionado de IRPF (módulos)"
    entity: AEAT
    category: "IRPF"
    periodicity: "Trimestral"
    description: "Pago a cuenta del IRPF para autónomos en estimación objetiva."
    url: "https://sede.agenciatributaria.gob.es/Sede/irpf.html"
    auto: true
    applies:
      legal_forms: ["autonomo"]
      irpf_methods: ["modulos"]
      economic_activity: true
    schedule:
      type: quarterly
      due_months: [1, 4, 7, 10]
      due_day: 20
    documents:
      - "Datos de módulos del periodo"
      - "Facturas emitidas y recibidas"
    notes: "Sujeto a los módulos y coeficientes del ejercicio."

  - code: "111"
