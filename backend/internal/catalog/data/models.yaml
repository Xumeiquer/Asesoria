    entity: AEAT
    category: "Retenciones"
    periodicity: "Trimestral"
    description: "Ingreso de retenciones sobre rendimientos del trabajo y de actividades profesionales."
    url: "https://sede.agenciatributaria.gob.es/Sede/irpf.html"
    auto: true
    applies:
      has_employees: true
    schedule:
      type: quarterly
      due_months: [1, 4, 7, 10]
      due_day: 20
    documents:
