version: "2026.1"
# Fecha de la última revisión del catálogo. Cada modelo puede sobrescribirla
# con su propio campo updated_at si su ficha se revisa en otra fecha.
updated_at: "2026-10-29"
# Catálogo de obligaciones. Es data, no código: se versiona por ejercicio.
# auto: true  -> se genera automáticamente en el calendario del contribuyente.
# auto: false -> aparece en el catálogo y puede añadirse a mano (trámites puntuales).
models:
  - code: "036"
    name: "Alta, modificación y baja censal"
    entity: AEAT
    category: "Censal"
    periodicity: "Puntual"
    description: "Sirve para darse de alta, cambiar datos o darse de baja en el censo de Hacienda. Es el trámite censal básico para autónomos y sociedades antes de empezar la actividad o cuando cambia."
    url: "https://sede.agenciatributaria.gob.es/Sede/procedimientoini/G322.shtml"
    auto: false
    documents:
      - "Modelo 036 cumplimentado y firmado"
      - "DNI/NIE del titular o escritura de constitución, si se solicita NIF"
      - "Escritura de apoderamiento, si actúa un representante"
    notes: "Se presenta antes de iniciar la actividad o en el plazo de un mes desde el cambio."

  - code: "037"
    name: "Declaración censal simplificada (suprimida)"
    entity: AEAT
    category: "Censal"
    periodicity: "Puntual"
    updated_at: "2025-02-03"
    description: "Modelo histórico suprimido por la AEAT el 3 de febrero de 2025. Ya no se presenta: las altas, cambios y bajas censales se hacen con el modelo 036."
    url: "https://sede.agenciatributaria.gob.es/Sede/todas-noticias/2025/enero/9/orden-ministerial-modificacion-declaraciones-censales.html"
    auto: false
    obsolete: true
    applies:
      legal_forms: ["autonomo"]
    documents: []
    notes: "Modelo sin validez desde el 3 de febrero de 2025. No lo presentes: utiliza el modelo 036 para cualquier alta, cambio o baja censal."

  - code: "303"
    name: "Autoliquidación de IVA"
    entity: AEAT
    category: "IVA"
    periodicity: "Trimestral"
    description: "Sirve para declarar y pagar el IVA de cada trimestre o mes: el IVA cobrado en las facturas menos el IVA soportado en gastos e inversiones."
    url: "https://sede.agenciatributaria.gob.es/Sede/procedimientoini/G414.shtml"
    auto: true
    applies:
      economic_activity: true
    schedule:
      type: quarterly
      due_months: [1, 4, 7, 10]
      due_day: 20
    documents:
      - "Libro registro de facturas emitidas y recibidas"
      - "Facturas y justificantes de gastos deducibles"
      - "Documentos de importación, exportación y operaciones intracomunitarias"
      - "Autoliquidaciones de IVA de otros Estados miembros, si aplica"
    notes: "Mensual para grandes empresas, grupos de IVA, REDEME y SII. Plazo: 1-20 del mes siguiente."

  - code: "390"
    name: "Resumen anual de IVA"
    entity: AEAT
    category: "IVA"
    periodicity: "Anual"
    description: "Sirve para resumir el IVA del año y comprobar que los datos coinciden con los modelos 303 presentados. Se presenta una vez al año."
    url: "https://sede.agenciatributaria.gob.es/Sede/procedimientoini/G412.shtml"
    auto: true
    applies:
      economic_activity: true
    schedule:
      type: annual
      due_months: [1]
      due_day: 31
      period_year_offset: -1
    documents:
      - "Modelos 303 del ejercicio"
      - "Libro registro de facturas emitidas y recibidas"
    notes: "Plazo: 1-31 de enero. Algunos sujetos están exonerados; revisa el supuesto."

  - code: "130"
    name: "Pago fraccionado de IRPF (estimación directa)"
    entity: AEAT
    category: "IRPF"
    periodicity: "Trimestral"
    description: "Sirve para ir pagando a cuenta el IRPF durante el año. Lo usan los autónomos en estimación directa y se calcula sobre el beneficio acumulado."
    url: "https://sede.agenciatributaria.gob.es/Sede/procedimientoini/G601.shtml"
    auto: true
    applies:
      legal_forms: ["autonomo"]
      irpf_methods: ["directa"]
      economic_activity: true
    schedule:
      type: quarterly
      due_months: [1, 4, 7, 10]
      due_day: 20
    documents:
      - "Libro registro de ingresos y gastos"
      - "Facturas emitidas y recibidas"
      - "Nóminas y seguros sociales"
      - "Retenciones soportadas o practicadas"
      - "Amortizaciones"
    notes: "20% del rendimiento neto acumulado, menos retenciones y pagos previos."

  - code: "131"
    name: "Pago fraccionado de IRPF (módulos)"
    entity: AEAT
    category: "IRPF"
    periodicity: "Trimestral"
    description: "Sirve para ir pagando a cuenta el IRPF durante el año. Lo usan los autónomos en estimación objetiva (módulos), según su actividad."
    url: "https://sede.agenciatributaria.gob.es/Sede/procedimientoini/G602.shtml"
    auto: true
    applies:
      legal_forms: ["autonomo"]
      irpf_methods: ["modulos"]
      economic_activity: true
    schedule:
      type: quarterly
      due_months: [1, 4, 7, 10]
      due_day: 20
    documents:
      - "Datos de módulos: índices, módulos y coeficientes"
      - "Libro registro de facturas emitidas y recibidas"
      - "Justificantes de gastos, si aplica"
    notes: "Sujeto a los módulos y coeficientes del ejercicio."

  - code: "111"
    name: "Retenciones e ingresos a cuenta del trabajo y profesionales"
    entity: AEAT
    category: "Retenciones"
    periodicity: "Trimestral"
    description: "Sirve para ingresar en Hacienda las retenciones de IRPF que se descuentan en nóminas y en facturas de profesionales."
    url: "https://sede.agenciatributaria.gob.es/Sede/procedimientoini/GH01.shtml"
    auto: true
    applies:
      has_employees: true
    schedule:
      type: quarterly
      due_months: [1, 4, 7, 10]
      due_day: 20
    documents:
      - "Nóminas y relación de perceptores"
      - "Facturas de profesionales con retención"
      - "Justificantes de las retenciones practicadas"
    notes: "Mensual para grandes empresas y obligados al SII."

  - code: "190"
    name: "Resumen anual de retenciones del trabajo y profesionales"
    entity: AEAT
    category: "Retenciones"
    periodicity: "Anual"
    description: "Sirve para resumir las retenciones del trabajo y de profesionales declaradas durante el año en el modelo 111."
    url: "https://sede.agenciatributaria.gob.es/Sede/procedimientoini/GI10.shtml"
    auto: true
    applies:
      has_employees: true
    schedule:
      type: annual
      due_months: [1]
      due_day: 31
      period_year_offset: -1
    documents:
      - "Modelos 111 del ejercicio"
      - "Certificados de retención emitidos"
      - "Nóminas y datos de perceptores"
    notes: "Plazo: 1-31 de enero."

  - code: "115"
    name: "Retenciones por arrendamiento de inmuebles"
    entity: AEAT
    category: "Retenciones"
    periodicity: "Trimestral"
    description: "Sirve para ingresar las retenciones de IRPF que se descuentan al pagar el alquiler de un local o una vivienda."
    url: "https://sede.agenciatributaria.gob.es/Sede/procedimientoini/GH02.shtml"
    auto: true
    applies:
      has_rentals: true
    schedule:
      type: quarterly
      due_months: [1, 4, 7, 10]
      due_day: 20
    documents:
      - "Contratos de arrendamiento"
      - "Facturas o recibos de alquiler"
      - "Justificantes de las retenciones practicadas"
    notes: "Mensual para grandes empresas y obligados al SII."

  - code: "180"
    name: "Resumen anual de retenciones por arrendamiento"
    entity: AEAT
    category: "Retenciones"
    periodicity: "Anual"
    description: "Sirve para resumir las retenciones por alquileres declaradas durante el año en el modelo 115."
    url: "https://sede.agenciatributaria.gob.es/Sede/procedimientoini/GI00.shtml"
    auto: true
    applies:
      has_rentals: true
    schedule:
      type: annual
      due_months: [1]
      due_day: 31
      period_year_offset: -1
    documents:
      - "Modelos 115 del ejercicio"
      - "Contratos y datos de arrendadores"
    notes: "Plazo: 1-31 de enero."

  - code: "123"
    name: "Retenciones sobre rendimientos del capital mobiliario"
    entity: AEAT
    category: "Retenciones"
    periodicity: "Trimestral"
    description: "Sirve para ingresar las retenciones que se aplican a intereses, dividendos y otros rendimientos del capital mobiliario."
    url: "https://sede.agenciatributaria.gob.es/Sede/procedimientoini/GH04.shtml"
    auto: false
    schedule:
      type: quarterly
      due_months: [1, 4, 7, 10]
      due_day: 20
    documents:
      - "Certificados de intereses y dividendos"
      - "Justificantes de las retenciones practicadas"
    notes: "Solo si la sociedad o el autónomo practica este tipo de retenciones."

  - code: "193"
    name: "Resumen anual de retenciones del capital mobiliario"
    entity: AEAT
    category: "Retenciones"
    periodicity: "Anual"
    description: "Sirve para resumir las retenciones del capital mobiliario declaradas durante el año en el modelo 123."
    url: "https://sede.agenciatributaria.gob.es/Sede/procedimientoini/GI12.shtml"
    auto: false
    schedule:
      type: annual
      due_months: [1]
      due_day: 31
      period_year_offset: -1
    documents:
      - "Modelos 123 del ejercicio"
      - "Certificados emitidos a perceptores"

  - code: "216"
    name: "Retenciones de no residentes"
    entity: AEAT
    category: "Retenciones"
    periodicity: "Trimestral"
    description: "Sirve para ingresar las retenciones que se aplican a las rentas pagadas a personas o empresas no residentes en España."
    url: "https://sede.agenciatributaria.gob.es/Sede/procedimientoini/GF05.shtml"
    auto: false
    schedule:
      type: quarterly
      due_months: [1, 4, 7, 10]
      due_day: 20
    documents:
      - "Contratos con no residentes"
      - "Certificados de residencia fiscal"
      - "Facturas y recibos"

  - code: "296"
    name: "Resumen anual de retenciones de no residentes"
    entity: AEAT
    category: "Retenciones"
    periodicity: "Anual"
    description: "Sirve para resumir las retenciones a no residentes declaradas durante el año en el modelo 216."
    url: "https://sede.agenciatributaria.gob.es/Sede/procedimientoini/GI22.shtml"
    auto: false
    schedule:
      type: annual
      due_months: [1]
      due_day: 31
      period_year_offset: -1
    documents:
      - "Modelos 216 del ejercicio"
      - "Certificados de residencia"

  - code: "349"
    name: "Declaración recapitulativa de operaciones intracomunitarias"
    entity: AEAT
    category: "Informativas"
    periodicity: "Trimestral"
    description: "Sirve para informar a Hacienda de las entregas y adquisiciones de bienes o servicios con otros países de la UE. Se usa para controlar el IVA intracomunitario."
    url: "https://sede.agenciatributaria.gob.es/Sede/procedimientoini/GI28.shtml"
    auto: true
    applies:
      economic_activity: true
    schedule:
      type: quarterly
      due_months: [1, 4, 7, 10]
      due_day: 20
    documents:
      - "Facturas intracomunitarias"
      - "NIF-IVA de los clientes/proveedores"
      - "Libro registro de facturas emitidas y recibidas"
      - "Libro registro de operaciones intracomunitarias"
      - "Justificantes de transporte o entrega, si aplica"
    notes: "Verifica los NIF-IVA en VIES antes de presentar. Mensual si se superan los umbrales o se está en SII."

  - code: "347"
    name: "Operaciones con terceras personas"
    entity: AEAT
    category: "Informativas"
    periodicity: "Anual"
    description: "Sirve para informar de las operaciones anuales con clientes y proveedores que superan 3.005,06 €. Hacienda lo usa para cruzar datos."
    url: "https://sede.agenciatributaria.gob.es/Sede/procedimientoini/GI27.shtml"
    auto: true
    applies:
      economic_activity: true
    schedule:
      type: annual
      due_months: [2]
      due_day: 28
      period_year_offset: -1
    documents:
      - "Facturas emitidas y recibidas del ejercicio"
      - "Resumen anual por cliente y proveedor"
      - "Datos fiscales de clientes y proveedores"
    notes: "Plazo: 1-28 de febrero (29 en año bisiesto)."

  - code: "200"
    name: "Impuesto sobre Sociedades"
    entity: AEAT
    category: "Sociedades"
    periodicity: "Anual"
    description: "Sirve para declarar y pagar el Impuesto sobre Sociedades del ejercicio, es decir, el resultado fiscal de la sociedad y su cuota final."
    url: "https://sede.agenciatributaria.gob.es/Sede/procedimientoini/GE04.shtml"
    auto: true
    applies:
      legal_forms: ["sl"]
    schedule:
      type: annual
      due_months: [7]
      due_day: 25
      period_year_offset: -1
    documents:
      - "Cuentas anuales y balance"
      - "Cuenta de pérdidas y ganancias"
      - "Ajustes fiscales y amortizaciones"
      - "Deducciones y bonificaciones"
      - "Pagos fraccionados (modelo 202)"
    notes: "Plazo: 25 días naturales tras los 6 meses del cierre. Si el cierre no es 31/12, ajusta la fecha."

  - code: "202"
    name: "Pagos fraccionados del Impuesto sobre Sociedades"
    entity: AEAT
    category: "Sociedades"
    periodicity: "Trimestral"
    description: "Sirve para pagar a cuenta el Impuesto sobre Sociedades durante el año. Se presenta en tres plazos."
    url: "https://sede.agenciatributaria.gob.es/Sede/procedimientoini/GE00.shtml"
    auto: true
    applies:
      legal_forms: ["sl"]
    schedule:
      type: custom
      dues:
        - month: 4
          day: 20
          period_start: "01-01"
          period_end: "03-31"
          period_year_offset: 0
        - month: 10
          day: 20
          period_start: "01-01"
          period_end: "09-30"
          period_year_offset: 0
        - month: 12
          day: 20
          period_start: "01-01"
          period_end: "11-30"
          period_year_offset: 0
    documents:
      - "Resultado contable del periodo"
      - "Ajustes fiscales"
      - "Deducciones y bonificaciones"
    notes: "Tres pagos: abril, octubre y diciembre. Revisa el régimen de pago fraccionado."

  - code: "100"
    name: "Declaración de la Renta (IRPF)"
    entity: AEAT
    category: "IRPF"
    periodicity: "Anual"
    description: "Sirve para declarar la renta anual del autónomo y regularizar el IRPF después de los pagos fraccionados y las retenciones."
    url: "https://sede.agenciatributaria.gob.es/Sede/procedimientoini/G229.shtml"
    auto: true
    applies:
      legal_forms: ["autonomo"]
    schedule:
      type: annual
      due_months: [6]
      due_day: 30
      period_year_offset: -1
    documents:
      - "Certificados de retenciones"
      - "Libro registro de ingresos y gastos"
      - "Facturas y justificantes de gastos"
      - "Amortizaciones"
      - "Datos de seguros, vivienda y familia"
      - "Pagos fraccionados (130/131)"
    notes: "Plazo: 1 de abril a 30 de junio."

  - code: "714"
    name: "Impuesto sobre el Patrimonio"
    entity: AEAT
    category: "Patrimonio"
    periodicity: "Anual"
    description: "Sirve para declarar el patrimonio personal cuando supera el mínimo exento y, si corresponde, pagar el Impuesto sobre el Patrimonio."
    url: "https://sede.agenciatributaria.gob.es/Sede/procedimientoini/G611.shtml"
    auto: false
    schedule:
      type: annual
      due_months: [6]
      due_day: 30
      period_year_offset: -1
    documents:
      - "Inventario de bienes y derechos"
      - "Deudas y cargas"
    notes: "Plazo: 1 de abril a 30 de junio."

  - code: "720"
    name: "Bienes y derechos en el extranjero"
    entity: AEAT
    category: "Informativas"
    periodicity: "Anual"
    description: "Sirve para informar a Hacienda de cuentas, inmuebles, valores y otros bienes situados en el extranjero cuando se superan los límites."
    url: "https://sede.agenciatributaria.gob.es/Sede/procedimientoini/GI34.shtml"
    auto: false
    schedule:
      type: annual
      due_months: [3]
      due_day: 31
      period_year_offset: -1
    documents:
      - "Extractos bancarios extranjeros"
      - "Escrituras y títulos de propiedad"
      - "Valoraciones"
    notes: "Plazo: 1 de enero a 31 de marzo."

  - code: "721"
    name: "Criptomonedas en el extranjero"
    entity: AEAT
    category: "Informativas"
    periodicity: "Anual"
    description: "Sirve para informar de las criptomonedas custodiadas en exchanges o carteras del extranjero cuando se superan los límites."
    url: "https://sede.agenciatributaria.gob.es/Sede/procedimientoini/GI55.shtml"
    auto: false
    schedule:
      type: annual
      due_months: [3]
      due_day: 31
      period_year_offset: -1
    documents:
      - "Extractos de exchanges"
      - "Direcciones y saldos"
    notes: "Plazo: 1 de enero a 31 de marzo."

  - code: "840"
    name: "Alta en el Impuesto sobre Actividades Económicas"
    entity: AEAT
    category: "Censal"
    periodicity: "Puntual"
    description: "Sirve para darse de alta, cambiar o darse de baja en el Impuesto sobre Actividades Económicas (IAE) por la actividad o el local."
    url: "https://sede.agenciatributaria.gob.es/Sede/procedimientoini/G323.shtml"
    auto: false
    applies:
      economic_activity: true
    documents:
      - "Modelo 840"
      - "Datos de la actividad: epígrafe IAE, CNAE y fecha de inicio"
      - "Datos del local: dirección y superficie"
    notes: "No aplica a autónomos exentos por facturación o inicio de actividad en los términos legales."

  - code: "184"
    name: "Declaración informativa de entidades en régimen de atribución de rentas"
    entity: AEAT
    category: "Informativas"
    periodicity: "Anual"
    description: "Sirve para que las comunidades de bienes, sociedades civiles y otras entidades sin personalidad informen de las rentas que reparten entre sus socios o comuneros."
    url: "https://sede.agenciatributaria.gob.es/Sede/procedimientoini/GI04.shtml"
    auto: false
    schedule:
      type: annual
      due_months: [1]
      due_day: 31
      period_year_offset: -1
    documents:
      - "Contrato de constitución"
      - "Rentas y gastos de la entidad"
      - "Datos de los socios/comuneros"

  - code: "232"
    name: "Operaciones vinculadas"
    entity: AEAT
    category: "Informativas"
    periodicity: "Anual"
    description: "Sirve para informar de las operaciones con personas o empresas vinculadas, como socios o sociedades del mismo grupo, cuando se alcanzan los límites."
    url: "https://sede.agenciatributaria.gob.es/Sede/procedimientoini/GI43.shtml"
    auto: false
    schedule:
      type: annual
      due_months: [11]
      due_day: 30
      period_year_offset: -1
    documents:
      - "Detalle de operaciones vinculadas"
      - "Métodos de valoración"
      - "Documentación del grupo"

  - code: "600"
    name: "Impuesto sobre Transmisiones Patrimoniales y AJD"
    entity: AEAT
    category: "Otros tributos"
    periodicity: "Puntual"
    description: "Sirve para declarar y pagar el ITP y AJD en compras de bienes, préstamos o documentos notariales. En la mayoría de comunidades se presenta ante la comunidad autónoma."
    url: "https://sede.agenciatributaria.gob.es/Sede/declaraciones-informativas-otros-impuestos-tasas/impuesto-sobre-transmisiones-patrimoniales-actos-juridicos/itp-ajd-transmisiones-derechos-reales-fianzas/descarga-modelo-600.html"
    auto: false
    documents:
      - "Escritura, contrato o documento notarial"
      - "Valoración de los bienes, si la base imponible no consta en el documento"
      - "Justificante de pago, si ya se ha autoliquidado"
    notes: "Gestión transferida a las comunidades autónomas; el modelo y plazo varían."

  - code: "650"
    name: "Impuesto sobre Sucesiones"
    entity: AEAT
    category: "Otros tributos"
    periodicity: "Puntual"
    description: "Sirve para declarar y pagar el Impuesto sobre Sucesiones cuando se recibe una herencia. La gestión corresponde a la comunidad autónoma."
    url: "https://sede.agenciatributaria.gob.es/Sede/procedimientoini/G702.shtml"
    auto: false
    documents:
      - "Certificado de defunción"
      - "Testamento, declaración de herederos o certificado de últimas voluntades"
      - "Inventario y valoración de bienes"
      - "Justificante de pago, si ya se ha autoliquidado"
    notes: "Plazo de 6 meses desde el fallecimiento, prorrogable. Gestión autonómica."

  - code: "651"
    name: "Impuesto sobre Donaciones"
    entity: AEAT
    category: "Otros tributos"
    periodicity: "Puntual"
    description: "Sirve para declarar y pagar el Impuesto sobre Donaciones cuando se recibe un bien o dinero por donación. La gestión corresponde a la comunidad autónoma."
    url: "https://sede.agenciatributaria.gob.es/Sede/procedimientoini/G703.shtml"
    auto: false
    documents:
      - "Escritura o documento notarial de donación"
      - "Valoración de los bienes donados"
      - "Justificante de pago, si ya se ha autoliquidado"
    notes: "Plazo de 30 días hábiles. Gestión autonómica."

  - code: "RETA-ALTA"
    name: "Alta en el RETA"
    entity: TGSS
    category: "Cotización"
    periodicity: "Puntual"
    description: "Sirve para darse de alta como autónomo en el Régimen Especial de Trabajadores Autónomos (RETA) antes de iniciar la actividad."
    url: "https://portal.seg-social.gob.es/wps/portal/importass/importass/Categorias/Altas%2C+bajas+y+modificaciones/Altas+y+afiliacion+de+trabajadores/Alta_trabajo_autonomo"
    auto: false
    applies:
      legal_forms: ["autonomo"]
    documents:
      - "DNI/NIE o identificación electrónica"
      - "Código IAE y administración tributaria"
      - "Código CNAE"
      - "Fecha de inicio y domicilio de la actividad"
      - "Estimación de rendimientos netos anuales"
      - "Base de cotización y beneficios aplicables"
      - "Mutua colaboradora y coberturas"
      - "Cuenta bancaria y autorización del titular, si no es el titular"
    notes: "Alta antes de iniciar la actividad, con un máximo de 60 días de antelación. Para bajas y cambios de datos, usa el trámite específico de la TGSS."

  - code: "CCC-RNT"
    name: "Alta de empresa y cuenta de cotización (CCC/RNT)"
    entity: TGSS
    category: "Cotización"
    periodicity: "Puntual"
    description: "Sirve para inscribir a la empresa en la Seguridad Social y obtener su número de la Seguridad Social y su cuenta de cotización. Es el paso previo para contratar trabajadores."
