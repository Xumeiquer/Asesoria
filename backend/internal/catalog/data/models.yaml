      - "Ajustes fiscales y amortizaciones"
      - "Pagos fraccionados (modelo 202)"
    notes: "Plazo: 25 días naturales tras los 6 meses del cierre. Si el cierre no es 31/12, ajusta la fecha."

  - code: "202"
    name: "Pagos fraccionados del Impuesto sobre Sociedades"
    entity: AEAT
    category: "Sociedades"
    periodicity: "Trimestral"
    description: "Pagos a cuenta del Impuesto sobre Sociedades."
    url: "https://sede.agenciatributaria.gob.es/Sede/impuestos-tasas.html"
    auto: true
    applies:
      legal_forms: ["sl"]
    schedule:
      type: custom
      dues:
        - month: 4
          day: 20
          period_start: "01-01"
          period_end: "03-31"
          period_year_offset: 0
        - month: 10
          day: 20
          period_start: "01-01"
          period_end: "09-30"
          period_year_offset: 0
        - month: 12
          day: 20
          period_start: "01-01"
          period_end: "11-30"
          period_year_offset: 0
    documents:
      - "Resultado contable del periodo"
      - "Ajustes fiscales"
      - "Deducciones y bonificaciones"
    notes: "Tres pagos: abril, octubre y diciembre. Revisa el régimen de pago fraccionado."

